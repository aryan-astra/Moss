# Moss automated release.
#
# Trigger: push a tag named v<Version>, e.g. v1.0.0
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The workflow restores, builds, tests, and publishes a single
# self-contained Moss.exe from source (no install, no separate runtime,
# no ZIP to extract), hashes it, and attaches Moss-<Version>-windows-x64.exe
# (+ .sha256 checksum) to a GitHub Release titled "Moss <Version>".
# Users download one file and run it.
#
# Version consistency is enforced, not assumed:
#   1. The tag must have the form v1.<minor>.<patch> (releases are 1.x only).
#   2. The tag must exactly match <Version> in Directory.Build.props,
#      which is also the version stamped into the compiled Moss.exe.
# Any mismatch fails the run before anything is built or published.
#
# The release is built from the compilable source tree (Moss.sln, src/,
# tests/, scripts/) at the repository root. If that tree is absent the run
# fails fast with an explicit message instead of a cryptic build error.
#
# If a Release already exists for the pushed tag (e.g. the binaries were
# published manually), the run exits successfully without doing anything
# instead of failing or duplicating the release.

name: release

on:
  push:
    tags:
      - 'v1.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check for existing release
        id: preskip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to build."
            'skip=true' >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No release for $tag yet; proceeding with the build."
            'skip=false' >> $env:GITHUB_OUTPUT
          }

      - name: Resolve and validate version
        if: steps.preskip.outputs.skip != 'true'
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(1\.\d+\.\d+)$') {
            throw "Refusing to release: tag '$tag' must have the form v1.<minor>.<patch> (e.g. v1.0.0)."
          }
          $number = $Matches[1]
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props'
          $declared = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($declared -ne $number) {
            throw "Refusing to release: tag '$tag' does not match <Version>$declared</Version> in Directory.Build.props. Update the file or retag."
          }
          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Require source tree
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'Moss.sln')) {
            throw 'Moss.sln not found at the repository root. Push the Moss source tree first; releases are built from source, not from the checked-in portable copy.'
          }

      - name: Set up .NET 8 SDK
        if: steps.preskip.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: dotnet restore Moss.sln

      - name: Build
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: dotnet build Moss.sln -c Release --no-restore

      - name: Test
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: dotnet run --project tests/Moss.Tests -c Release --no-build -- .

      - name: Publish single-file exe
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: >
          dotnet publish src/Moss.Windows -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:DebugType=None
          -o artifacts/Moss-win-x64

      - name: Stage release asset
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = 'artifacts/Moss-win-x64/Moss.exe'
          if (-not (Test-Path -LiteralPath $built)) { throw "Expected single-file build output '$built' is missing." }
          $exe = "artifacts/Moss-${{ steps.version.outputs.number }}-windows-x64.exe"
          Copy-Item -LiteralPath $built -Destination $exe -Force
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash | Out-File "$exe.sha256" -Encoding ascii

      - name: Create GitHub Release
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $number = '${{ steps.version.outputs.number }}'
          $exe = "artifacts/Moss-$number-windows-x64.exe"
          gh release create $tag $exe "$exe.sha256" --title "Moss $number" --notes "Moss $number for Windows 10/11 x64. Download Moss-$number-windows-x64.exe and run it — no install, no separate runtime, no extraction needed. Character packs, docs and licenses live in this repository."
