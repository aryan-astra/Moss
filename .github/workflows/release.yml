# Moss automated release.
#
# Trigger: push a tag named v<Version>, e.g. v1.0.0
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The workflow checks out the tagged commit, runs scripts/build.ps1
# (restore, build, test, dual publish, package), then creates a GitHub
# Release with the portable ZIP, the single-file Moss.exe and SHA256SUMS.txt.
# Users download the ZIP, extract it anywhere and run Moss.exe — no install,
# no separate runtime. Moss-<Version>-windows-x64.exe is the same build for
# direct download.
#
# Version consistency is enforced, not assumed:
#   1. The tag must have the form v1.<minor>.<patch> (releases are 1.x only).
#   2. The tag must exactly match <Version> in Directory.Build.props,
#      which is also the version stamped into the compiled Moss.exe.
# Any mismatch fails the run before anything is built or published.
#
# If a Release already exists for the pushed tag, the run exits successfully
# without doing anything instead of failing or duplicating the release.
# Every step fails the run visibly on error; a failed run never publishes.

name: release

on:
  push:
    tags:
      - 'v1.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check for existing release
        id: preskip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to build."
            'skip=true' >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No release for $tag yet; proceeding with the build."
            'skip=false' >> $env:GITHUB_OUTPUT
          }

      - name: Resolve and validate version
        if: steps.preskip.outputs.skip != 'true'
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(1\.\d+\.\d+)$') {
            throw "Refusing to release: tag '$tag' must have the form v1.<minor>.<patch> (e.g. v1.0.0)."
          }
          $number = $Matches[1]
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props'
          $declared = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($declared -ne $number) {
            throw "Refusing to release: tag '$tag' does not match <Version>$declared</Version> in Directory.Build.props. Update the file or retag."
          }
          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Require source tree
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'Moss.sln')) {
            throw 'Moss.sln not found at the repository root. Push the Moss source tree first; releases are built from source.'
          }

      - name: Set up .NET 8 SDK
        if: steps.preskip.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, test, publish, package
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Create GitHub Release
        if: steps.preskip.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $short = $env:COMMIT_SHA.Substring(0, 7)
          $sums = Get-Content -LiteralPath 'artifacts/SHA256SUMS.txt' -Raw
          $notes = @"
          Moss $env:VERSION_NUMBER for Windows 10/11 x64, built from $env:TAG_NAME (commit $short).

          Download Moss-$env:VERSION_NUMBER-windows-x64.zip, extract it anywhere and run Moss.exe — no install, no separate .NET runtime needed. Moss-$env:VERSION_NUMBER-windows-x64.exe is the same single-file build for direct download.

          Unsigned portable build; character packs, docs and licenses are inside the ZIP and in this repository.

          Checksums (SHA256SUMS.txt):
          $sums
          "@
          gh release create $env:TAG_NAME "artifacts/Moss-$env:VERSION_NUMBER-windows-x64.zip" "artifacts/Moss-$env:VERSION_NUMBER-windows-x64.exe" artifacts/SHA256SUMS.txt --title "Moss $env:VERSION_NUMBER" --notes $notes
